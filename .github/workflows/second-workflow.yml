name: Test Workflow
on: workflow_dispatch
jobs: 
  first-job: 
    runs-on: ubuntu-latest
    steps:
      - name: Get Repository
        uses: actions/checkout@v3
      - name: Install Node
        uses: actions/setup-node@v3
        with: 
          node-version: 24
      - name: Install Dependency
        working-directory: 2. Actions - Blocks And Components/starting-project
        run: npm ci

      - name: Run Test
        working-directory: 2. Actions - Blocks And Components/starting-project
        run: npm test