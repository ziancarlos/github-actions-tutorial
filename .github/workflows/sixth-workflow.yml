name: Fourth Workflow
on: 
  pull_request:
    types:
      - opened
  push:
    branches:
      - main
      - 'dev-*'
      - 'feat/**'
    paths-ignore:
      - './.github/workflows/*'
  workflow_dispatch:
    
jobs:
  deploy: 
    runs-on: ubuntu-latest
    steps:
    - name: Output Event Data
      run: echo '${{ toJSON(github.event) }}'
    - name: Checkout Code
      uses: actions/checkout@v3
    - name: Install Node
      uses: actions/setup-node@v3
      with: 
        node-version: 24
    - name: Install Dependency
      working-directory: 3. Advanced Workflows And Events/starting-project
      run: npm ci
    - name: Build Project
      working-directory: 3. Advanced Workflows And Events/starting-project
      run: npm run build
