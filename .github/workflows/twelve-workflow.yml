name: Reusable Workflow
on: 
  workflow_call:
    inputs:
      file_name: 
        description: file_name
        default: dist
        type: string
jobs: 
  info:
    runs-on: ubuntu-latest
    steps:
      - name: Echoing
        uses: actions/download-artifact@v4
        with:
          name: ${{inputs.file_name}}
      - name: echo
        run: ls -a