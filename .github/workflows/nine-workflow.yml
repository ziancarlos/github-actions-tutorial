name: Nine Workflow
on:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v3
      - name: Cache Dependenies
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          working-directory: 6. Controlling Workflow And Jobs/starting-project
          key: node-modules-${{hashFiles('**/package-lock.json')}}
      - name: Install Dependencies
        working-directory: 6. Controlling Workflow And Jobs/starting-project
        run: npm ci
      - name: Lint Code
        working-directory: 6. Controlling Workflow And Jobs/starting-project
        run: npm run lint
        
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v3
      - name: Cache Dependenies
        id: cache
        uses: actions/cache@v4
        with:
          working-directory: 6. Controlling Workflow And Jobs/starting-project
          path: ~/.npm
          key: node-modules-${{hashFiles('**/package-lock.json')}}
      - name: Install Dependencies
        working-directory: 6. Controlling Workflow And Jobs/starting-project
        run: npm ci
      - name: TestCode
        id: trigger-test
        working-directory: 6. Controlling Workflow And Jobs/starting-project
        run: npm run test
      - name: Upload Test Report
        if: steps.trigger-test.output.outcome == 'failure'  
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: 6. Controlling Workflow And Jobs/starting-project/test.json

  build:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v3
      - name: Cache Dependenies
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          working-directory: 6. Controlling Workflow And Jobs/starting-project
          key: node-modules-${{hashFiles('**/package-lock.json')}}
      - name: Install Dependencies
        working-directory: 6. Controlling Workflow And Jobs/starting-project
        run: npm ci
      - name: TestCode
        working-directory: 6. Controlling Workflow And Jobs/starting-project
        run: npm run build
      - name: Upload Build Results
        uses: actions/upload-artifact@v4
        with:
          working-directory: 6. Controlling Workflow And Jobs/starting-project
          name: dist-result
          path: 6. Controlling Workflow And Jobs/starting-project/dist

  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Get Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-result
      - name: Output Contents
        run: ls
      - name: Deploy
        run: echo "Deploying"
