name: Deploy Website
on: 
  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v3
      - name: Install Dependency
        working-directory: 4. Job Artifacts And Output/starting-project
        run: npm ci
      - name: Test Code
        working-directory: 4. Job Artifacts And Output/starting-project
        run: npm run test
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v3
      - name: Install Dependency
        working-directory: 4. Job Artifacts And Output/starting-project
        run: npm ci
      - name: Test Code
        working-directory: 4. Job Artifacts And Output/starting-project
        run: npm run build